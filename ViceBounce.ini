[ViceBounce]
; Default keys (change them in [Keys] at the end of this file):
; F4 buildings, F5 vegetation, F6 cars, F7 street objects, F8 bikes/boats/aircraft,
; F9 all people including Tommy. F10 aligns squash to the current audible beat.
; F11 opens the ViceBounce menu; Change track opens the importer.
; ` (the key below Esc) or Pause pauses and resumes the music.
; End reloads this file. - / = tempo -/+5 BPM. , / . amplitude -/+0.025.
; / switches between Russian style and UK style.
; Changes made using hotkeys are saved here.
Enabled=1
OtherVehicles=1
AllPeople=0
Vegetation=0
VegetationStrength=0.31075
VegetationMaxDisplacement=1.13
Buildings=0
BuildingStrength=0.339
BuildingMaxDisplacement=4.52
StreetObjects=0
StreetStrength=1.0
; Loop a local track while the game is open; relative paths are beside this INI.
MusicEnabled=0
; 1 keeps the track paused; the MusicPause key toggles this.
MusicPaused=0
MusicFile=
; Position of a strong beat in this exact file, in milliseconds. AlignBeat calibrates it.
MusicFirstBeatMs=0
MusicSourceFile=
MusicBeatMapFile=
MusicUseBeatMap=1
MusicAutoImport=1
MusicSyncOffsetMs=0
; Niko B - Why's this dealer? (original version)
BPM=135
Amplitude=0.20
; 0 linear, 1 sine, 2 quadratic, 3 bounce
Easing=1
; 0 Russian style: classic smooth squash, curve from Easing above.
; 1 UK style: snappy squash of the Toyota Yaris meme, curve from UKEasing below.
BounceStyle=0
; UK style curves: 0 linear, 1 sine, 2 quad, 3 cubic, 4 quart, 5 quint,
; 6 expo, 7 circ, 8 back, 9 elastic, 10 bounce.
UKEasing=6

[Keys]
; Up to two keys per action, separated by commas; None disables an action.
; Names: F1-F24, A-Z, 0-9, Home, End, Insert, Delete, PageUp, PageDown, Backspace, Tab,
; Pause, ScrollLock, Grave, Minus, Equals, Comma, Period, Slash, Semicolon, Apostrophe,
; LeftBracket, RightBracket, Backslash, Numpad0-Numpad9, NumpadPlus, NumpadMinus,
; NumpadMultiply, NumpadDivide, NumpadDecimal, or a code such as 0x13.
; Avoid the game's own keys: F1-F3 replays, PgUp/PgDn sniper zoom, Home camera,
; Insert radio, Delete lock-on, and letters (cheat codes).
Buildings=F4
Vegetation=F5
Cars=F6
StreetObjects=F7
OtherVehicles=F8
AllPeople=F9
AlignBeat=F10
; Always opens/closes the mod menu, including vehicles and pause.
MusicPicker=F11
Reload=End
MusicPause=Grave, Pause
TempoDown=Minus
TempoUp=Equals
AmplitudeDown=Comma
AmplitudeUp=Period
BounceStyle=Slash

[Online]
; Read a small public metadata file from our GitHub repository in the background.
; No music, game files or user identifiers are uploaded. No automatic installation.
Enabled=1
CheckUpdates=1
ShowAnnouncements=1
CheckIntervalHours=24
